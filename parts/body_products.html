    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="mb-6">
            <span class="text-xs font-bold text-emerald-500 uppercase tracking-widest translate-me">FULL CATALOG</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1 translate-me">Packaged Products Database</h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm mt-1 translate-me">Search, filter and sort all 355 analyzed packaged foods.</p>
        </div>

        <div class="relative w-full mb-4">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search by product name, brand, category, ingredient, additive (e.g. E211)..."
                class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 mb-6 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1 translate-me">Nutri-Score</label>
                <select id="gradeDropdown" onchange="applyFilters()" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="All">All Grades</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1 translate-me">Sugar Level</label>
                <select id="sugarDropdown" onchange="applyFilters()" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="All">All Levels</option><option value="low">Low (&le; 5g)</option><option value="moderate">Moderate (5-22.5g)</option><option value="high">High (&gt; 22.5g)</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1 translate-me">Sodium Level</label>
                <select id="sodiumDropdown" onchange="applyFilters()" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="All">All Levels</option><option value="low">Low (&lt; 120mg)</option><option value="moderate">Moderate (120-600mg)</option><option value="high">High (&gt; 600mg)</option>
                </select>
            </div>
            <div class="flex items-end gap-4">
                <label class="flex items-center gap-2 text-xs font-semibold text-emerald-600 cursor-pointer"><input type="checkbox" id="vegCheckbox" onchange="applyFilters()" class="rounded text-emerald-500 w-4 h-4"><span><i class="fa-solid fa-leaf"></i> <span class="translate-me">Veg Only</span></span></label>
                <label class="flex items-center gap-2 text-xs font-semibold text-emerald-600 cursor-pointer"><input type="checkbox" id="veganCheckbox" onchange="applyFilters()" class="rounded text-emerald-500 w-4 h-4"><span><i class="fa-solid fa-seedling"></i> <span class="translate-me">Vegan Only</span></span></label>
            </div>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-4 mb-4 text-xs font-semibold" id="categoryContainer"></div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-5 py-3 flex flex-wrap items-center justify-between gap-4 mb-8 shadow-sm">
            <div class="text-xs font-semibold text-slate-600 dark:text-slate-400"><span class="translate-me">Showing</span> <span id="productCount" class="text-emerald-500 font-bold">0</span> <span class="translate-me">of</span> <span id="productTotal">0</span> <span class="translate-me">Products</span></div>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-arrow-down-up-across-line text-xs text-slate-400"></i>
                <label for="sortSelect" class="text-xs font-semibold text-slate-500 dark:text-slate-400 translate-me">Sort by:</label>
                <select id="sortSelect" onchange="applyFilters()" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="nutriScore">Nutri-Score Grade (A to E)</option>
                    <option value="name">Product Name (A-Z)</option>
                    <option value="calories">Lowest Calories</option>
                </select>
            </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-4xl text-slate-300 dark:text-slate-700 mb-3"></i>
            <p class="text-slate-500 dark:text-slate-400 text-base font-semibold translate-me">No products match your criteria.</p>
        </div>
        <div class="text-center mt-8">
            <button id="loadMoreBtn" onclick="loadMore()" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 font-bold px-6 py-3 rounded-full text-xs shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                <span class="translate-me">Load More Products</span>
            </button>
        </div>
    </main>
